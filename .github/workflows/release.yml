name: Release

# Publishes the version in pyproject.toml as a GitHub release with the wheel,
# the sdist and their SHA-256 sums attached. This fork is not on PyPI (the
# isdi-scanner name there is upstream's); users install from these releases.
#
# To release: add the version's section to CHANGELOG.md (what changes for
# staff), bump the version (VERSION_PART=minor make bump-version), merge
# that to main, then run this workflow from the Actions tab.
#
# It also runs by itself when a change to the blocklist reaches main: the
# weekly indicators PR bumps the patch version, so merging it publishes a
# release and installed copies can pick up the new list. A push whose
# version is already released is skipped, not failed.
#
# Besides the wheel and sdist, each release carries constraints.txt: the
# exact dependency versions that were installed and smoke-tested on each
# supported Python, so a clinic can reinstall what was tested
# (pip install -c constraints.txt <wheel>).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/isdi/data/app-flags.csv"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read and check version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if ! grep -qx "__version__ = \"$version\"" src/isdi/__init__.py; then
            echo "::error::src/isdi/__init__.py does not say version $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::notice::v$version is already released; nothing to publish"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::v$version is already released; bump the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The release notes start with the version's CHANGELOG.md section
      # (what changes for staff). Blocklist-only patch releases have none.
      - name: Write release notes
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          notes=release/notes.md
          if python scripts/release_notes.py "$VERSION" > "$notes"; then
            cat "$notes"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            printf '%s\n\n%s\n' "## What changes for staff" \
              "The stalkerware blocklist is updated. Upgrade to detect newly listed apps." > "$notes"
          else
            echo "::error::CHANGELOG.md has no section for $VERSION; add one first"
            exit 1
          fi

      - name: Run tests
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pytest tests/ -q

      - name: Build wheel and sdist
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install build
          python -m build --outdir release/dist

      - name: Keep the build for the next jobs
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

  # Install the wheel on each supported Python, smoke-test it, and record
  # the dependency versions that were installed.
  pin:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release/

      - name: Install, smoke-test and pin
        env:
          PY: ${{ matrix.python-version }}
        run: |
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/env/bin/pip" install release/dist/*.whl
          "$RUNNER_TEMP/env/bin/pip" freeze --exclude isdi-scanner > "freeze-$PY.txt"
          cat "freeze-$PY.txt"
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/env/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_test_wheel.py")

      - uses: actions/upload-artifact@v4
        with:
          name: freeze-${{ matrix.python-version }}
          path: freeze-${{ matrix.python-version }}.txt

  publish:
    needs: [build, pin]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release/

      - uses: actions/download-artifact@v4
        with:
          pattern: freeze-*
          path: freezes/
          merge-multiple: true

      - name: Write constraints.txt and checksums
        run: |
          python3 scripts/merge_constraints.py release/dist/constraints.txt freezes/freeze-*.txt
          cat release/dist/constraints.txt
          cd release/dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" release/dist/* \
            --target "$GITHUB_SHA" \
            --title "ISDi v$VERSION" \
            --notes-file release/notes.md \
            --generate-notes
