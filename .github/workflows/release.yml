name: Release

# Publishes the version in pyproject.toml as a GitHub release with the wheel,
# the sdist and their SHA-256 sums attached. This fork is not on PyPI (the
# isdi-scanner name there is upstream's); users install from these releases.
#
# To release: bump the version (VERSION_PART=minor make bump-version), merge
# that to main, then run this workflow from the Actions tab.
#
# It also runs by itself when a change to the blocklist reaches main: the
# weekly indicators PR bumps the patch version, so merging it publishes a
# release and installed copies can pick up the new list. A push whose
# version is already released is skipped, not failed.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/isdi/data/app-flags.csv"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read and check version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if ! grep -qx "__version__ = \"$version\"" src/isdi/__init__.py; then
            echo "::error::src/isdi/__init__.py does not say version $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::notice::v$version is already released; nothing to publish"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::v$version is already released; bump the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pytest tests/ -q

      - name: Build wheel and sdist
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install build
          rm -rf dist
          python -m build
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "ISDi v$VERSION" \
            --generate-notes
