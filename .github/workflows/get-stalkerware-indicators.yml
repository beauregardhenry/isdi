# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Sync IOC Stalkerware Indicators

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/get-stalkerware-indicators.py"
      - ".github/workflows/get-stalkerware-indicators.yml"
  schedule:
    # Weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-indicators:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Update
      run: |
        python scripts/get-stalkerware-indicators.py

    # A new blocklist only reaches installed copies through a release, so
    # bump the patch version in the same PR: merging it publishes a release
    # (release.yml runs on changes to app-flags.csv).
    - name: Bump the patch version if the blocklist changed
      env:
        VERSION_PART: patch
      run: |
        if git diff --quiet -- src/isdi/data/app-flags.csv; then
          echo "Blocklist unchanged"
        else
          python scripts/bump_version.py
        fi

    # PRs opened with GITHUB_TOKEN do not trigger other workflows, so the
    # required "Tests" checks would never run and the PR could not merge.
    # INDICATORS_PR_TOKEN should be a fine-grained personal access token for
    # this repository only, with Contents and Pull requests set to read/write.
    - name: Check PR token
      env:
        INDICATORS_PR_TOKEN: ${{ secrets.INDICATORS_PR_TOKEN }}
      run: |
        if [ -z "$INDICATORS_PR_TOKEN" ]; then
          echo "::warning::INDICATORS_PR_TOKEN is not set; falling back to GITHUB_TOKEN. CI will not run on the generated PR, so required checks will block it."
        fi

    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        add-paths: |
          src/isdi/data/app-flags.csv
          src/isdi/data/app-flags.meta.json
          pyproject.toml
          src/isdi/__init__.py
          README.md
          TERMUX_INSTALL.md

        token: ${{ secrets.INDICATORS_PR_TOKEN || secrets.GITHUB_TOKEN }}
        commit-message: Update stalkerware indicators
        committer: GitHub <noreply@github.com>
        author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        signoff: false
        branch: chore/update-stalkerware-indicators
        delete-branch: true
        title: 'Update stalkerware indicators'
        body: |
          Updates the blocklist from the AssoEchap stalkerware-indicators list,
          and bumps the patch version.

          **Merging this publishes a release** (release.yml), so installed
          copies can get the new list by upgrading.

          Auto-generated by [create-pull-request](https://github.com/peter-evans/create-pull-request).
        labels: |
          automated pr
        draft: false
    - name: Check outputs
      if: ${{ steps.cpr.outputs.pull-request-number }}
      run: |
        echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
        echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
